  const series = kids.map(f => { const fi = S.favs.indexOf(f);
    return {name:f.name, short:f.name.split(" ")[0], fav:true, color: fi === 1 ? "var(--s-fav2)" : "var(--s-fav1)",
      values: events.map(c => { const x = done.find(r => r.comp.id === c.id && r.name === f.name); return x && x.pct != null ? x.pct : null; })}; })
    .filter(s => s.values.some(v => v != null));
  const chart = events.length >= 2 && series.length ? foldSec("h_pct", "Trend: procent efter vinnaren",
    `<div class="legend">${series.map(s => `<span><i class="lk" style="background:${s.color}"></i>${esc(s.short)}</span>`).join("")}</div>`
    + lineChart({xs, series, invert:true, connect:true, fmtY: v => v === 0 ? "0 %" : "+" + Math.round(v) + " %", fmtTip: v => "+" + v.toFixed(1) + " %", zero:true, pctSteps:true})
    + `<p class="note" style="margin:2px 0 0">Procent efter vinnaren i klassen – går att jämföra mellan olika klasser och banlängder. Uppåt = bättre.</p>`) : "";
  // lista
  const list = [...rows].reverse().map(r => {
    const st = S.hist[r.comp.id+"|"+r.cls]?.starters;
    const res = r.result ? `<div class="r-time tnum" style="font-size:16px">${fmt(r.result)}</div><div class="r-plus tnum">${r.plus > 0 ? fmtPlus(r.plus) : "Vinnare"}</div>`
                         : `<span class="chip bad">${STATUS[r.status]}</span>`;
    return `<button class="list-item" data-act="pickcomp" data-id="${r.comp.id}">
      <span class="avatar-btn">${avatar(r.name, 40)}${r.place ? `<span class="place pl tnum ${r.place===1?"gold":""}">${r.place}</span>` : ""}</span>
      <div class="grow"><div class="t">${esc(r.comp.name)}</div><div class="s">${esc(r.comp.date)} · ${esc(r.name.split(" ")[0])} · ${esc(r.cls)}${r.club ? " · för " + esc(r.club) : ""}${r.place && st ? ` · ${r.place} av ${st}` : ""}</div></div>
      <div style="text-align:right">${res}</div></button>`;
  }).join("");
  $view.innerHTML = seg + progress + tilesHtml + chart + foldSec("h_list", "Alla lopp", `<div class="card">${list}</div>`);
  fillStarters(rows);
}

/* ================== Hemvy: barnen mellan tävlingar + dagens tävlingar ================== */
function ensureComps(force){
  if(S.compList || S.loadingComps || (S.compErr && !force)) return;
  S.loadingComps = true; S.compErr = null;
  api({method:"getcompetitions"}, 40000).then(d => { S.compList = d.competitions || []; scanCompetitions(); loadFeatured(); })
    .catch(e => { S.compErr = e.message; }).finally(() => { S.loadingComps = false; if(["live","comps","history"].includes(S.tab)) render(); });
}
function compErrHtml(){
  return S.compErr ? `<div class="card err-card"><div class="runner"><b>Kunde inte hämta tävlingar</b><div class="note" style="margin:4px 0 10px">${esc(S.compErr)}</div>
    <button class="btn small primary" data-act="retrycomps">Försök igen</button></div></div>` : "";
}
function shortDate(iso){
  const m = ["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
  const today = todayStr(), tm = new Date(Date.parse(today) + 864e5).toISOString().slice(0,10);
  if(iso === today) return "idag"; if(iso === tm) return "imorgon";
  return (+iso.slice(8,10)) + " " + m[+iso.slice(5,7)-1];
}
function idleCard(f){
  const today = todayStr();
  const mine = (S.compList || []).filter(c => S.entries[c.id]?.names?.includes(f.name));
  const next = mine.filter(c => c.date >= today).sort((a,b) => a.date.localeCompare(b.date))[0];
  const last = historyRows().filter(r => r.name === f.name && r.comp.date < today).pop();
  const lastTxt = last ? (last.result ? `${last.place ? last.place + ":a" : "I mål"}${last.place && S.hist[last.comp.id+"|"+last.cls]?.starters ? " av " + S.hist[last.comp.id+"|"+last.cls].starters : ""} · ${esc(last.comp.name)} · ${shortDate(last.comp.date)}`
                                   : `${STATUS[last.status]} · ${esc(last.comp.name)} · ${shortDate(last.comp.date)}`) : "";
  const chip = next && next.date === today ? `<span class="chip run">TÄVLAR IDAG</span>` : `<span class="chip charge">⚡ LADDAR FÖR NÄSTA TÄVLING</span>`;
  return `<div class="card idle"><div class="runner"><div class="r-top">${avatar(f.name,56)}<div style="min-width:0"><div class="r-name">${esc(f.name)}</div>
    <div class="r-meta">${esc(f.club)}</div><div style="margin-top:6px">${chip}</div></div></div>
    <div class="idle-rows">
      ${next ? `<button class="idle-row" data-act="pickcomp" data-id="${next.id}"><span class="idle-l">Nästa</span><span class="idle-v">${esc(next.name)} · ${shortDate(next.date)}</span><span class="chev">›</span></button>`
             : `<div class="idle-row"><span class="idle-l">Nästa</span><span class="idle-v muted">${S.compErr ? "Kunde inte hämta tävlingar" : (!S.compList || (S.scan.running && !S.scan.futureDone)) ? "Letar…" : "Inte upplagd på LiveResults än"}</span></div>`}
      ${lastTxt ? `<button class="idle-row" data-act="tab" data-tab="history"><span class="idle-l">Senast</span><span class="idle-v">${lastTxt}</span><span class="chev">›</span></button>` : ""}
    </div></div></div>`;
}

// Dagens tävlingar: några utvalda (svensk tid), rankade på typ och storlek
S.featured = null; S.showAllToday = false;
const FEAT_PLUS = /\b(SM|JSM|USM|VSM)\b|svenska mästerskap|o-ringen|sverigecup|rankning|nationell|\bDM\b|distriktsmästerskap|natt|stafett|jukola|tiomila|25manna|sprint|budapest|ungdomens/i;
const FEAT_MINUS = /test|träning|training|demo|prov|övning/i;
async function loadFeatured(){
  const today = todayStr();
  if(S.featured && S.featured.date === today) return;
  const list = (S.compList || []).filter(c => c.date === today && (+c.timediff || 0) === 0);
  S.featured = {date: today, items: list.map(c => ({c, classes: null})), loading: true};
  const queue = [...S.featured.items].slice(0, 40);
  const worker = async () => { while(queue.length){ const it = queue.shift();
    try{ const d = await api({method:"getclasses", comp: it.c.id}); it.classes = (d.classes || []).length; }catch{ it.classes = 0; } } };
  await Promise.all([worker(), worker(), worker(), worker()]);
  S.featured.loading = false;
  if(["live","comps"].includes(S.tab)) render();
}
function featuredScore(it){
  const t = it.c.name + " " + it.c.organizer;
  return (FEAT_PLUS.test(t) ? 40 : 0) - (FEAT_MINUS.test(t) ? 100 : 0) + Math.min(60, it.classes || 0) + (S.entries[it.c.id]?.names?.length ? 200 : 0);
}
function featuredHtml(){
  if(!S.featured) return "";
  const items = S.featured.items.filter(it => it.classes !== 0).sort((a,b) => featuredScore(b) - featuredScore(a));
  if(!items.length) return S.featured.loading ? liveSec("l_today", "Tävlingar idag", `<div class="spinner"></div>`) : liveSec("l_today", "Tävlingar idag", `<p class="note">Inga tävlingar på LiveResults idag.</p>`);
  const show = S.showAllToday ? items : items.slice(0, 3);
  const body = `<div class="card">${show.map(({c, classes}) => { const names = S.entries[c.id]?.names || [];
    return `<button class="list-item" data-act="pickcomp" data-id="${c.id}">
      ${names.length ? `<div class="avatars">${names.map(n => avatar(n,30)).join("")}</div>` : `<span class="feat-flag"></span>`}
      <div class="grow"><div class="t">${esc(c.name)}</div><div class="s">${esc(c.organizer)}${classes ? ` · ${classes} klasser` : ""}</div></div>
      ${S.comp && S.comp.id === c.id ? `<span class="chip ok">Vald</span>` : `<span class="chev">›</span>`}</button>`; }).join("")}</div>
    ${items.length > 3 ? `<p class="note" style="text-align:center"><button class="back" data-act="alltoday">${S.showAllToday ? "Visa färre" : `Visa alla ${items.length} tävlingar idag`}</button></p>` : ""}`;
  return liveSec("l_today", "Tävlingar idag", body);
}
function renderHome(){
  ensureComps();
  $view.innerHTML = compErrHtml() + (S.favs.length ? liveSec("l_mina", "Mina löpare", S.favs.map(idleCard).join("")) : "") + featuredHtml()
    + (!S.featured && !S.compErr ? `<div class="spinner"></div>` : "");
}

/* ================== Render ================== */
const $view = document.getElementById("view");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const starSvg = on => `<svg width="22" height="22" viewBox="0 0 24 24" fill="${on?"currentColor":"none"}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>`;

function renderHeader(){
  document.getElementById("hTitle").textContent = S.comp ? S.comp.name : "Kjellberger LiveOL";
  const dot = document.getElementById("liveDot"), st = document.getElementById("hStatus");
  document.getElementById("closeComp").classList.toggle("hidden", !S.comp);
  if(!S.comp){ dot.className = "dot"; st.textContent = "Översikt · välj en tävling för att följa live"; return; }
  if(S.error){ dot.className = "dot err"; st.textContent = S.error; return; }
  dot.className = "dot" + (pollTimer ? " live" : "");
  const ago = S.lastOk ? Math.round((Date.now()-S.lastOk)/1000) : null;
  st.textContent = `${S.comp.date} · ${S.comp.organizer||""}` + (ago != null ? ` · uppd. ${ago < 5 ? "nyss" : ago + " s sedan"}` : "");
}

function render(){
  CHARTS.clear();
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
  ({live:renderLive, browse:renderBrowse, comps:renderComps, history:renderHistory, follow:renderFollow})[S.tab]();
  renderHeader();
}

function placeBadge(r){
  const p = parseInt(r.place,10);
  if(phase(r) === "done" && p > 0) return `<span class="place tnum ${p===1?"gold":""}">${p}</span>`;
  return "";
}
function statusChip(r){
  const ph = phase(r);
  if(ph === "done") return `<span class="chip ok">I MÅL</span>`;
  if(ph === "run") return `<span class="chip run">I TERRÄNGLÅDAN</span>`;
  if(ph === "out") return `<span class="chip bad">${esc(STATUS[r.status]||"–")}</span>`;
  return `<span class="chip wait">Start ${fmtClock(r.start) || "–"}</span>`;
}
function lastPlace(r, sp){
  const A = classAnalysis(r.cls); if(!A) return null;
  const i = r.splits.indexOf(sp); return i >= 0 ? A.placeOf(i, sp.time) || null : null;
}
function runnerCard(r){
  const k = keyOf(r.name, r.club), ph = phase(r), open = S.expanded.has(k);
  let right = "";
  if(ph === "done") right = `<div class="r-time tnum">${fmt(r.result)}</div><div class="r-plus tnum">${fmtPlus(r.plus)}</div>`;
  else if(ph === "run") right = `<div class="r-time tnum" data-run="${r.start}">${fmt(nowCompCs()-r.start)}</div><div class="r-plus">löptid</div>`;
  const last = [...r.splits].reverse().find(s=>s.time);
  const done = r.splits.filter(s=>s.time).length;
  let extra = "";
  if(ph === "run"){
    const pct = r.splits.length ? Math.round(done / (r.splits.length+1) * 100) : (r.progress ?? 0);
    extra += `<div class="progress"><i style="width:${Math.max(4,pct)}%"></i></div>`;
    extra += last ? `<div class="last">Senast: <b>${esc(last.name)}</b> ${fmt(last.time)} · plats ${esc(lastPlace(r, last) || last.place || "–")} <span class="tnum">${fmtPlus(last.plus)}</span></div>`
                  : `<div class="last">${r.splits.length ? "Ingen radiokontroll passerad än" : "Inga radiokontroller i klassen"}</div>`;
    if(isFav(r.name, r.club)) extra += predictHtml(r);
  }
  if(ph === "wait" && r.start && isFav(r.name, r.club)) right = `<div class="r-time tnum" data-cd="${r.start}" style="font-size:15px">${countdownText(r.start)}</div>`;
  let splitsHtml = "";
  if(open){
    splitsHtml = `<div class="splits">${r.hasSplits ? analysisHtml(r) : `<div class="note">Hämtar mellantider…</div>`}
      ${r.start ? `<div class="note">Starttid ${fmtClock(r.start)}</div>` : ""}</div>
      <div class="row-actions">
        ${ph === "done" && isFav(r.name, r.club) ? `<button class="btn small primary" data-act="share" data-key="${esc(k)}">Dela resultat</button>` : ""}
        <button class="btn small" data-act="openclass" data-cls="${esc(r.cls)}">Visa klassen</button>
        <button class="btn small" data-act="fav" data-name="${esc(r.name)}" data-club="${esc(r.club)}">${isFav(r.name,r.club) ? "Ta bort favorit" : "Gör till favorit"}</button>
      </div>`;
  }
  return `<div class="card"><button class="runner" data-act="toggle" data-key="${esc(k)}">
    <div class="r-top">${isFav(r.name,r.club) ? `<span class="avatar-btn">${avatar(r.name,48)}${placeBadge(r).replace('class="place','class="place pl')}</span>` : placeBadge(r)}<div style="min-width:0"><div class="r-name">${esc(r.name)}</div>
      <div class="r-meta">${esc(r.cls)} · ${esc(r.club)}</div><div style="margin-top:6px">${statusChip(r)}</div></div>
      <div class="r-right">${right}</div></div>${extra}</button>${splitsHtml}</div>`;
}

function liveSec(id, title, body){
  const open = S.fold[id] ?? true;
  return `<details class="fold live-sec" data-fold="${esc(id)}" ${open ? "open" : ""}><summary>${title}</summary>${body}</details>`;
}
function renderLive(){
  if(!S.comp){ renderHome(); return; }
  if(!S.clubs.length && !S.favs.length){
    $view.innerHTML = `<div class="empty"><h2>Du följer ingen ännu</h2><p>Lägg till din klubb, eller stjärnmärk löpare under Klasser.</p><button class="btn primary" data-act="tab" data-tab="follow">Följ en klubb</button></div>`;
    return;
  }
  const rs = [...S.runners.values()];
  if(!rs.length && !S.favs.length){
    $view.innerHTML = S.lastOk ? `<div class="empty"><h2>Inga löpare hittades</h2><p>Ingen från ${esc([...S.clubs].join(", ")||"dina favoriter")} verkar vara anmäld i den här tävlingen. Kontrollera att klubbnamnet stavas exakt som i LiveResults.</p><button class="btn" data-act="tab" data-tab="browse">Bläddra i klasser</button></div>` : `<div class="spinner"></div>`;
    return;
  }
  const favCards = S.favs.map(f => {
    const r = rs.find(x => normName(x.name) === normName(f.name) && sameClub(f.club, x.club));
    if(r) return runnerCard(r);
    const known = S.entries[S.comp.id];
    if(S.lastScan || S.lastOk || (known && known.clubs && !known.names.includes(f.name))) return idleCard(f).replace('<div style="margin-top:6px">', '<div style="margin-top:6px"><span class="chip wait" style="margin-right:6px">Ej med i denna tävling</span>');
    return `<div class="card"><div class="runner"><div class="r-top">${avatar(f.name,46)}<div><div class="r-name">${esc(f.name)}</div><div class="r-meta">${esc(f.club)}</div>
      <div style="margin-top:6px"><span class="chip wait">Letar…</span></div></div></div></div></div>`;
  }).join("");
  const others = rs.filter(r => !isFav(r.name, r.club));
  const groups = {run:[], done:[], wait:[], out:[]};
  others.forEach(r => groups[phase(r)].push(r));
  groups.run.sort((a,b)=> (b.splits.filter(s=>s.time).length - a.splits.filter(s=>s.time).length) || (a.start-b.start));
  groups.done.sort((a,b)=> a.cls.localeCompare(b.cls,"sv") || (parseInt(a.place)||999)-(parseInt(b.place)||999));
  groups.wait.sort((a,b)=> (a.start||9e9)-(b.start||9e9));
  const favFirst = arr => arr.sort((a,b)=> isFav(b.name,b.club)-isFav(a.name,a.club));
  const sec = (title, arr) => arr.length ? liveSec("l_"+title, `${title} (${arr.length})`, favFirst(arr).map(runnerCard).join("")) : "";
  const kidsIn = S.favs.some(f => rs.some(x => normName(x.name) === normName(f.name)));
  const browseHint = !kidsIn && (S.lastScan || S.lastOk || S.entries[S.comp.id]?.clubs) ? `<div class="card" style="margin-top:10px"><button class="list-item" data-act="tab" data-tab="browse">
      <span class="feat-flag"></span><div class="grow"><div class="t">Följ tävlingen ändå</div><div class="s">Se resultat och mellantider klass för klass</div></div><span class="chev">›</span></button></div>` : "";
  $view.innerHTML = (S.favs.length ? liveSec("l_mina", "Mina löpare", favCards + browseHint) : "") + sec("I terränglådan", groups.run) + sec("I mål", groups.done) + sec("Ej startat", groups.wait) + sec("Ej godkänd / ej start", groups.out) +
    `<p class="note">Tryck på en löpare för mellantider. Uppdateras var 15:e sekund.</p>`;
}

async function renderBrowse(){
  if(!S.comp){ $view.innerHTML = `<div class="empty"><h2>Ingen tävling vald</h2><button class="btn primary" data-act="tab" data-tab="comps">Välj tävling</button></div>`; return; }
  if(S.browseClass){
    const d = S.classData.get(S.browseClass);
    const back = `<button class="back" data-act="classback">‹ Alla klasser</button><div class="section-title" style="margin-top:4px">${esc(S.browseClass)}</div>`;
    if(!d){ $view.innerHTML = back + `<div class="spinner"></div>`; refreshClass(S.browseClass).then(()=>S.tab==="browse"&&render()).catch(e=>{$view.innerHTML = back + `<p class="note">Fel: ${esc(e.message)}</p>`}); return; }
    const rs = d.results.map(r => normalizeRunner(r, S.browseClass, d.splitcontrols));
    $view.innerHTML = back + `<div class="card">` + rs.map(r => {
      const ph = phase(r);
      const res = ph === "done" ? `${fmt(r.result)} <span class="r-plus">${fmtPlus(r.plus)}</span>` : ph === "run" ? `<span class="chip run">I TERRÄNGLÅDAN</span>` : ph === "out" ? `<span class="chip bad">${STATUS[r.status]}</span>` : `<span class="r-plus">${fmtClock(r.start)}</span>`;
      const fav = isFav(r.name, r.club);
      return `<div class="list-item"><span class="place tnum ${ph==="done"?"":"none"}" style="min-width:28px;height:28px;font-size:13px">${ph==="done" ? esc(r.place) : "–"}</span>
        <div class="grow"><div class="t">${esc(r.name)}</div><button class="s" style="text-align:left" data-act="followclub" data-club="${esc(r.club)}">${esc(r.club)}${isClubFollowed(r.club)?" · följs":""}</button></div>
        <div class="tnum" style="text-align:right">${res}</div>
        <button class="star ${fav?"on":""}" aria-label="Favorit" data-act="fav" data-name="${esc(r.name)}" data-club="${esc(r.club)}">${starSvg(fav)}</button></div>`;
    }).join("") + `</div><p class="note">★ = följ löparen. Tryck på ett klubbnamn för att följa hela klubben.</p>`;
    return;
  }
  if(!S.classList){
    $view.innerHTML = `<div class="spinner"></div>`;
    try{ const d = await api({method:"getclasses", comp:S.comp.id}); S.classList = (d.classes||[]).map(c=>c.className); }
    catch(e){ $view.innerHTML = `<p class="note">Kunde inte hämta klasser: ${esc(e.message)}</p>`; return; }
    if(S.tab !== "browse") return;
  }
  $view.innerHTML = `<input class="search" id="clsSearch" placeholder="Sök klass…" autocomplete="off" value="${esc(S.clsQuery||"")}"><div class="card" style="margin-top:10px" id="clsList"></div>`;
  const draw = () => {
    const q = (S.clsQuery||"").toLowerCase();
    const list = S.classList.filter(c => c.toLowerCase().includes(q));
    document.getElementById("clsList").innerHTML = list.length ? list.map(c => `<button class="list-item" data-act="openclass" data-cls="${esc(c)}"><div class="grow t">${esc(c)}</div>${S.classesOfInterest.has(c)?`<span class="chip run">följs</span>`:""}<span class="chev">›</span></button>`).join("") : `<div class="list-item s">Inga klasser</div>`;
  };
  draw();
  document.getElementById("clsSearch").oninput = e => { S.clsQuery = e.target.value; draw(); };
}

async function renderComps(){
  if(!S.compList){ ensureComps(); $view.innerHTML = S.compErr ? compErrHtml() : `<div class="spinner"></div>`; return; }
  $view.innerHTML = `<div id="compList"></div>`;
  drawComps();
  scanCompetitions();
}
function drawComps(){
  const box = document.getElementById("compList"); if(!box || !S.compList) return;
  const today = todayStr();
  const who = S.favs.map(f=>f.name.split(" ")[0]).join(" & ") || "dina löpare";
  const mine = S.compList.filter(c => S.entries[c.id]?.names?.length);
  const item = c => { const names = S.entries[c.id].names;
    return `<button class="list-item" data-act="pickcomp" data-id="${c.id}">
      <div class="avatars">${names.map(n=>avatar(n,34)).join("")}</div>
      <div class="grow"><div class="t">${esc(c.name)}</div><div class="s">${esc(c.date)} · ${esc(names.map(n=>n.split(" ")[0]).join(" & "))}${c.multidaystage ? " · etapp "+c.multidaystage : ""}</div></div>
      ${S.comp && S.comp.id===c.id ? `<span class="chip ok">Vald</span>` : `<span class="chev">›</span>`}</button>`; };
  const group = (title, arr) => arr.length ? `<div class="section-title">${title}</div><div class="card">${arr.map(item).join("")}</div>` : "";
  const todayL = mine.filter(c=>c.date===today);
  const upcoming = mine.filter(c=>c.date>today).sort((a,b)=>a.date.localeCompare(b.date));
  const past = mine.filter(c=>c.date<today).sort((a,b)=>b.date.localeCompare(a.date));
  const sc = S.scan;
  const progress = sc.running ? `<p class="note">Letar efter ${esc(who)} i tävlingarna… ${sc.done} av ${sc.total}</p><div class="scan-bar"><i style="width:${Math.round(sc.done/Math.max(1,sc.total)*100)}%"></i></div>` : "";
  const idle = !todayL.length && !upcoming.length && !sc.running
    ? liveSec("l_mina", "Mina löpare", S.favs.map(idleCard).join("") + `<p class="note">${esc(who)} syns här så fort arrangören lagt upp startlistan på LiveResults – ofta samma dag som tävlingen.</p>`) : "";
  box.innerHTML = progress + idle + group("Idag", todayL) + group("Kommande", upcoming) + featuredHtml() + group("Tidigare", past)
    + (!sc.running ? `<p class="note" style="text-align:center"><button class="back" data-act="rescan">Sök igen</button></p>` : "");
  if(!S.featured) loadFeatured();
}

function renderFollow(){
  const notifState = !("Notification" in window) ? "Stöds ej i denna webbläsare – öppna appen från hemskärmen" :
    Notification.permission === "granted" ? "Tillåtna" : Notification.permission === "denied" ? "Blockerade i iPhones inställningar" : "Inte aktiverade än";
  $view.innerHTML = `
    <div class="section-title">Följ hela klubbar (valfritt)</div>
    <div class="tags" id="clubTags">${S.clubs.map((c,i)=>`<span class="tag">${esc(c)}<button data-act="rmclub" data-i="${i}" aria-label="Ta bort">✕</button></span>`).join("") || `<span class="note">Inga klubbar</span>`}</div>
    <form class="inline-form" id="clubForm"><input class="search" id="clubIn" placeholder="Klubbnamn, t.ex. OK Ravinen" autocomplete="off" list="clubSug"><button class="btn primary">Lägg till</button></form>
    <datalist id="clubSug">${clubSuggestions().map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <p class="note">Stavas exakt som i LiveResults. Förslag visas från klasser du har öppnat.</p>

    <div class="section-title">Klubbar barnen tävlar för</div>
    <div class="tags">${favClubs().map(c => { const alt = S.altClubs.indexOf(c);
      return `<span class="tag">${esc(c)}${alt >= 0 ? `<button data-act="rmalt" data-i="${alt}" aria-label="Ta bort">✕</button>` : `<span class="note" style="margin:0 8px 0 2px">huvudklubb</span>`}</span>`; }).join("")}</div>
    <form class="inline-form" id="altForm"><input class="search" id="altIn" placeholder="T.ex. Västergötlands OF" autocomplete="off"><button class="btn primary">Lägg till</button></form>
    <p class="note">Appen letar efter Noel och Moa under alla dessa namn, t.ex. när de springer för distriktet eller landslaget. Namnet måste stavas som i LiveResults.</p>

    <div class="section-title">Favoriter</div>
    <div class="card">${S.favs.length ? S.favs.map((f,i)=>`<div class="list-item"><button class="avatar-btn" data-act="setavatar" data-name="${esc(f.name)}" aria-label="Byt bild">${avatar(f.name,48)}<span class="cam">✎</span></button><div class="grow"><div class="t">${esc(f.name)}</div><div class="s">${esc(f.club)}</div></div>
      <button class="star on" data-act="rmfav" data-i="${i}" aria-label="Ta bort">${starSvg(true)}</button></div>`).join("") : `<div class="list-item s">Stjärnmärk löpare under Klasser. Favoriter sparas mellan tävlingar.</div>`}</div>

    <p class="note">Tryck på bilden för att välja ett foto.</p>
    <div class="section-title">Klubblogga</div>
    <div class="card"><div class="list-item"><img class="club-logo" id="logoPrev" alt="" style="display:${store.get("logo",null)?"block":"none"}" src="${store.get("logo","")||""}">
      <div class="grow"><div class="t">IFK Göteborg Orientering</div><div class="s">Visas i appens sidhuvud</div></div>
      <button class="btn small" data-act="setlogo">Välj bild</button>${store.get("logo",null)?`<button class="btn small" data-act="rmlogo">Ta bort</button>`:""}</div></div>

    <div class="section-title">Inställningar</div>
    <div class="card">
      <label class="switch-row"><div class="grow"><div class="t">Notiser</div><div class="s note" style="margin:0">${notifState}</div></div>
        <input type="checkbox" class="toggle" id="notifT" ${S.notify && ("Notification" in window) && Notification.permission==="granted" ? "checked":""}></label>
      <label class="switch-row"><div class="grow"><div class="t">Håll skärmen tänd</div><div class="s note" style="margin:0">Bra när du följer en start</div></div>
        <input type="checkbox" class="toggle" id="wakeT" ${store.get("wake",false)?"checked":""}></label>
    </div>
    <p class="note">Notiser kommer när en följd löpare passerar en radiokontroll eller går i mål, medan appen är öppen. Data från liveresultat.orientering.se.</p>`;
  document.getElementById("clubForm").onsubmit = e => {
    e.preventDefault(); const v = document.getElementById("clubIn").value.trim();
    if(v && !isClubFollowed(v)){ S.clubs.push(v); store.set("clubs", S.clubs); S.lastClubFetch = 0; poll(); }
    render();
  };
  document.getElementById("altForm").onsubmit = e => {
    e.preventDefault(); const v = document.getElementById("altIn").value.trim();
    if(v && !favClubs().some(c => c.toLowerCase() === v.toLowerCase())){ S.altClubs.push(v); store.set("altclubs", S.altClubs); S.lastClubFetch = 0; S.lastScan = 0; poll(); }
    render();
  };
  document.getElementById("notifT").onchange = async e => {
    if(e.target.checked){ const ok = await askNotify(); S.notify = ok; }
    else S.notify = false;
    store.set("notify", S.notify); render();
  };
  document.getElementById("wakeT").onchange = e => setWake(e.target.checked);
}
function clubSuggestions(){
  const set = new Set();
  for(const d of S.classData.values()) for(const r of d.results) if(r.club) set.add(r.club);
  return [...set].sort((a,b)=>a.localeCompare(b,"sv")).slice(0,300);
}

/* ================== Händelser ================== */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act],[data-tab]");
  if(!el) return;
  const act = el.dataset.act || "tab";
  if(act === "tab"){ S.tab = el.dataset.tab; if(S.tab !== "browse") S.browseClass = null; render(); window.scrollTo(0,0); return; }
  if(act === "toggle"){ const k = el.dataset.key; S.expanded.has(k) ? S.expanded.delete(k) : S.expanded.add(k); render(); return; }
  if(act === "openclass"){ e.stopPropagation(); S.tab = "browse"; S.browseClass = el.dataset.cls; render(); window.scrollTo(0,0); return; }
  if(act === "classback"){ S.browseClass = null; render(); return; }
  if(act === "fav"){
    e.stopPropagation();
    const name = el.dataset.name, club = el.dataset.club;
    if(isFav(name, club)){ const f = favOf(name, club); S.favs = S.favs.filter(x => x !== f); }
    else { S.favs.push({name, club}); toast("Följer " + name, "Visas under Live."); }
    S.entries = {}; store.set("entries2", {});
    store.set("favs", S.favs); S.lastClubFetch = 0; S.lastScan = 0; render(); poll(); return;
  }
  if(act === "rmfav"){ S.favs.splice(+el.dataset.i,1); store.set("favs", S.favs); S.entries = {}; store.set("entries2", {}); S.lastClubFetch = 0; render(); poll(); return; }
  if(act === "rmclub"){ S.clubs.splice(+el.dataset.i,1); store.set("clubs", S.clubs); S.lastClubFetch = 0; render(); poll(); return; }
  if(act === "followclub"){
    e.stopPropagation(); const c = el.dataset.club; if(!c) return;
    if(isClubFollowed(c)){ if(confirm("Sluta följa "+c+"?")) S.clubs = S.clubs.filter(x=>x.toLowerCase()!==c.toLowerCase()); }
    else if(confirm("Följ alla löpare från "+c+"?")) S.clubs.push(c);
    store.set("clubs", S.clubs); S.lastClubFetch = 0; render(); poll(); return;
  }
  if(act === "rmalt"){ S.altClubs.splice(+el.dataset.i, 1); store.set("altclubs", S.altClubs); S.lastClubFetch = 0; render(); poll(); return; }
  if(act === "retrycomps"){ ensureComps(true); render(); return; }
  if(act === "alltoday"){ S.showAllToday = !S.showAllToday; render(); return; }
  if(act === "closecomp"){ S.comp = null; store.set("comp", null); stopPolling(); resetData(); render(); return; }
  if(act === "histkid"){ S.histKid = el.dataset.v; render(); return; }
  if(act === "share"){ e.stopPropagation(); const r = S.runners.get(el.dataset.key); if(r) shareResult(r); return; }
  if(act === "cmp"){ e.stopPropagation(); S.cmp[el.dataset.cls] = el.dataset.v; render(); return; }
  if(act === "setavatar"){
    const name = el.dataset.name;
    pickImage({square:true, max:256}).then(url => { if(!url) return; S.avatars[normName(name)] = url; store.set("avatars", S.avatars); render(); });
    return;
  }
  if(act === "setlogo"){
    pickImage({square:false, max:256, type:"image/png"}).then(url => { if(!url) return; store.set("logo", url); applyLogo(); render(); });
    return;
  }
  if(act === "rmlogo"){ try{ localStorage.removeItem("ollive.logo"); }catch{} applyLogo(); render(); return; }
  if(act === "rescan"){ S.entries = {}; store.set("entries2", {}); renderComps(); return; }
  if(act === "reloadcomps"){ S.compList = null; render(); return; }
  if(act === "pickcomp"){
    const c = S.compList.find(x => String(x.id) === el.dataset.id);
    S.comp = {id:c.id, name:c.name, organizer:c.organizer, date:c.date, timediff:c.timediff||0};
    store.set("comp", S.comp); resetData(); S.classList = null; S.browseClass = null;
    S.tab = "live"; render(); startPolling(); return;
  }
});

// Löptidsklockor tickar varje sekund utan att rita om allt
tickTimer = setInterval(() => {
  const now = nowCompCs();
  document.querySelectorAll("[data-run]").forEach(el => { el.textContent = fmt(now - +el.dataset.run); });
  document.querySelectorAll("[data-cd]").forEach(el => { el.textContent = countdownText(+el.dataset.cd); });
  document.querySelectorAll("[data-eta]").forEach(el => { el.textContent = etaText(+el.dataset.eta); });
  checkStartAlerts();
  if(S.tab === "live") renderHeader();
}, 1000);

document.addEventListener("visibilitychange", () => {
  if(document.hidden) stopPolling();
  else { startPolling(); if(store.get("wake",false)) setWake(true); }
});

// Lägg till nya standardnamn även om listan redan sparats i telefonen
if(!store.get("altmig1", false)){
  if(!S.altClubs.some(c => c.toLowerCase() === "göteborgs of")) S.altClubs.splice(1, 0, "Göteborgs OF");
  store.set("altclubs", S.altClubs); store.set("altmig1", true);
}
applyLogo();
if(S.comp && S.comp.date < todayStr()){ S.comp = null; store.set("comp", null); }   // gårdagens tävling → hemvyn
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
startPolling();
if(store.get("wake",false)) setWake(true);
</script>
</body>
